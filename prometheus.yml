global:
  external_labels:
    site: prod
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: 'nginx'
    static_configs:
      - targets: ['127.0.0.1:9113']

  - job_name: 'php-fpm'
    static_configs:
      - targets: ['127.0.0.1:9253']

  - job_name: 'mysql'
    static_configs:
      - targets: ['127.0.0.1:9104']

  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://127.0.0.1/'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
remote_write:
  - url: http://localhost:8428/api/v1/write
