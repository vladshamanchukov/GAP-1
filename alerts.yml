groups:
  - name: cms
    rules:
      - alert: CMSSiteDown
        expr: probe_success{job="blackbox"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "CMS down"
          description: "Blackbox cannot reach the site for more than 30 seconds."

      - alert: CMSSlowResponse
        expr: probe_duration_seconds{job="blackbox"} > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CMS responds slowly"
          description: "CMS response time exceeds 0.5 seconds for more than 1 minute."
